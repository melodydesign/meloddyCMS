<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Файловый менеджер - meloddyCMS</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="stylesheet" href="/css/style.css?v=20">
    <script src="/js/theme.js?v=20"></script>
    
    <!-- CodeMirror -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/codemirror.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/theme/material-darker.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/codemirror.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/mode/xml/xml.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/mode/javascript/javascript.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/mode/css/css.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/mode/htmlmixed/htmlmixed.min.js"></script>
    
    <style>
        html, body {
            height: 100%;
            margin: 0;
            overflow: hidden;
        }
        .app-layout {
            height: 100vh;
            max-height: 100vh;
            overflow: hidden;
        }
        .main-content {
            display: flex;
            flex-direction: column;
            height: calc(100vh - 96px);
            overflow: hidden;
            box-sizing: border-box;
        }
        .fm-container {
            display: flex;
            flex: 1;
            gap: 1.5rem;
            min-height: 0;
        }
        .file-list {
            width: 260px;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            overflow-y: auto;
            padding: 0.5rem 0;
            box-shadow: var(--shadow-sm);
        }
        .file-item {
            padding: 0.5rem 1rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 10px;
            color: var(--text-muted);
            font-size: 0.875rem;
            transition: all 0.15s;
        }
        .file-item svg { stroke: currentColor; opacity: 0.7; }
        .file-item:hover { background: var(--bg-hover); color: var(--text-main); }
        .file-item.active { background: var(--bg-active); border-right: 3px solid var(--primary); color: var(--text-main); font-weight: 500; }
        .file-item.active svg { stroke: var(--primary); opacity: 1; }
        
        .file-editor-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            overflow: hidden;
            box-shadow: var(--shadow-sm);
        }
        .editor-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1rem 1.5rem;
            border-bottom: 1px solid var(--border);
            background: var(--bg-card);
        }
        .editor-header h3 { margin: 0; font-size: 1rem; font-weight: 500; }
        
        /* CodeMirror overrides */
        .CodeMirror {
            flex: 1;
            height: 100% !important;
            font-family: 'Consolas', 'Monaco', monospace;
            font-size: 14px;
            background: var(--bg-card) !important;
            color: var(--text-main) !important;
        }
        [data-theme="dark"] .CodeMirror {
            background: #0f0f0f !important;
        }
        .CodeMirror-gutters {
            background: var(--bg-hover) !important;
            border-right: 1px solid var(--border) !important;
        }
        .CodeMirror-linenumber { color: var(--text-muted) !important; }
        .CodeMirror-cursor { border-left-color: var(--text-main) !important; }
        
        /* Light Theme Syntax Overrides */
        .cm-s-default .cm-tag { color: #1170ea; }
        .cm-s-default .cm-attribute { color: #d73a49; }
        .cm-s-default .cm-string { color: #032f62; }
        
        #imagePreview {
            flex: 1;
            display: none;
            align-items: center;
            justify-content: center;
            background: var(--bg-hover);
            padding: 2rem;
            overflow: auto;
        }
        #imagePreview img {
            max-width: 100%;
            max-height: 100%;
            border-radius: var(--radius-sm);
            box-shadow: var(--shadow-md);
        }
        #unsupportedPreview {
            flex: 1;
            display: none;
            align-items: center;
            justify-content: center;
            color: var(--text-muted);
            font-size: 0.9rem;
        }
        
        .path-breadcrumb {
            display: flex;
            align-items: center;
            gap: 6px;
            background: var(--bg-hover);
            padding: 6px 16px;
            border-radius: var(--radius-pill);
            border: 1px solid var(--border);
            font-size: 0.875rem;
            color: var(--text-muted);
            width: fit-content;
        }
        .path-breadcrumb span {
            cursor: pointer;
            color: var(--text-secondary);
            font-weight: 500;
            transition: color 0.2s;
        }
        .path-breadcrumb span:hover {
            color: var(--primary);
        }
        .path-breadcrumb span.active {
            color: var(--text-main);
            font-weight: 600;
            cursor: default;
        }
        .path-breadcrumb .separator {
            color: var(--text-placeholder);
            font-size: 0.75rem;
            user-select: none;
        }
        .editor-path-bar {
            display: none;
            align-items: center;
            gap: 8px;
            padding: 0.6rem 1.5rem;
            background: var(--bg-hover);
            border-bottom: 1px solid var(--border);
            font-size: 0.8rem;
            color: var(--text-muted);
            box-sizing: border-box;
            user-select: none;
        }
        .editor-path-bar svg {
            stroke: var(--text-muted);
            opacity: 0.8;
            flex-shrink: 0;
        }
        .editor-path-text {
            font-family: var(--font-mono), monospace;
            letter-spacing: 0.5px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
    </style>
</head>
<body>
    <!-- Mobile Navigation Drawer -->
    <div class="mobile-nav-drawer" id="mobileNavDrawer">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px;">
            <div style="font-weight: 700; font-size: 1.2rem; color: var(--text-main);">Menu</div>
            <button id="closeMobileMenuBtn" style="background: none; border: none; color: var(--text-muted); font-size: 1.5rem; cursor: pointer; line-height: 1;">&times;</button>
        </div>
        <a href="/dashboard.html" class="topbar-nav-item">Дашборд</a>
        <a href="/settings.html" class="topbar-nav-item">Настройки</a>
        <a href="/docs.html" class="topbar-nav-item">База знаний</a>
        <a href="/admin.html" id="adminMobileLink" class="topbar-nav-item" style="display: none;">Админка</a>
    </div>

    <div class="app-layout">
        <!-- Top Bar Navigation -->
        <header class="topbar">
            <div class="topbar-left">
                <button class="topbar-burger" id="mobileMenuBtn" style="display: none; margin-right: 12px;">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>
                </button>
                <a href="/dashboard.html" class="topbar-logo">
                    <img src="/favicon.svg" alt="meloddyCMS">
                    <span>meloddy<span class="text-gradient">CMS</span></span>
                </a>
                <nav class="topbar-nav">
                    <a href="/dashboard.html" class="topbar-nav-item">Дашборд</a>
                    <a href="/settings.html" class="topbar-nav-item">Настройки</a>
                    <a href="/docs.html" class="topbar-nav-item">База знаний</a>
                    <a href="/admin.html" id="adminSidebarLink" class="topbar-nav-item" style="display: none;">Админка</a>
                </nav>
            </div>
            <div class="topbar-right">
                <a href="#" id="themeToggleBtn" class="topbar-icon-btn" title="Сменить тему">
                    <svg id="theme-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></svg>
                </a>
                <a href="#" id="logoutBtn" class="topbar-icon-btn" title="Выйти">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg>
                </a>
                <div class="topbar-user" id="topbarUserInfo" style="display: none;">
                    <div class="topbar-avatar" id="topbarUserAvatar">U</div>
                    <div class="topbar-user-info">
                        <span class="topbar-user-name" id="topbarUserName">Загрузка...</span>
                        <span class="topbar-user-email" id="topbarUserEmail">...</span>
                    </div>
                </div>
            </div>
        </header>

        <!-- Main Content -->
        <main class="main-content">
            <h1 style="margin-bottom: 0.5rem;">Файловый менеджер</h1>
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem;">
                <div class="path-breadcrumb" id="breadcrumb" style="margin: 0;">/site/</div>
                <button id="uploadFileBtn" class="btn" style="padding: 0.4rem 0.8rem; font-size: 0.8rem;">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="margin-right: 4px;"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="17 8 12 3 7 8"></polyline><line x1="12" y1="3" x2="12" y2="15"></line></svg>
                    Загрузить
                </button>
                <input type="file" id="fileUploadInput" multiple style="display: none;">
            </div>
            
            <div class="fm-container">
                <div class="file-list" id="fileList">
                    <!-- Файлы -->
                </div>
                
                <div class="file-editor-area">
                    <div class="editor-header" style="display: flex; justify-content: space-between; align-items: center; padding: 1rem 1.5rem; border-bottom: 1px solid var(--border); background: var(--bg-card);">
                        <div>
                            <h3 id="currentFileName" style="margin: 0; font-size: 1.05rem; font-weight: 600; color: var(--text-main);">Выберите файл</h3>
                        </div>
                        <button id="saveFileBtn" class="btn" style="padding: 0.4rem 0.8rem; font-size: 0.8rem;" disabled>Сохранить</button>
                    </div>
                    <div id="editorPathBar" class="editor-path-bar">
                        <span id="editorPathIcon" style="display: flex; align-items: center; justify-content: center; height: 100%;">
                            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"></path><polyline points="13 2 13 9 20 9"></polyline></svg>
                        </span>
                        <span id="editorPathText" class="editor-path-text">/css/style.css</span>
                    </div>
                    <!-- Editor for code/text -->
                    <textarea id="fileEditor" disabled placeholder="Выберите файл для редактирования..."></textarea>
                    
                    <!-- Container for Images -->
                    <div id="imagePreview">
                        <img id="previewImg" src="" alt="Preview">
                    </div>
                    
                    <!-- Container for unsupported files -->
                    <div id="unsupportedPreview">
                        Предпросмотр недоступен для этого типа файла.
                    </div>
                </div>
            </div>
        </main>
    </div>
    
    <script src="/js/toast.js"></script>
    <script src="/js/file-manager.js"></script>
</body>
</html>
