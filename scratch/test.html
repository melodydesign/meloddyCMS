<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');
    body { background: #050505; color: #fff; font-family: 'Inter', sans-serif; padding: 50px; }
    
    .contact-wow-wrapper {
        position: relative;
        max-width: 1000px;
        margin: 0 auto;
        padding: 4rem;
        border-radius: 32px;
        background: rgba(15, 15, 20, 0.4);
        backdrop-filter: blur(20px);
        border: 1px solid rgba(255, 255, 255, 0.05);
        overflow: hidden;
        display: flex;
        gap: 4rem;
        box-shadow: 0 30px 60px rgba(0,0,0,0.4), inset 0 1px 0 rgba(255,255,255,0.1);
    }

    /* Glowing orbs inside the card */
    .contact-wow-wrapper::before {
        content: '';
        position: absolute;
        top: -20%;
        left: -10%;
        width: 50%;
        height: 70%;
        background: radial-gradient(circle, rgba(108, 92, 231, 0.4) 0%, transparent 60%);
        filter: blur(60px);
        z-index: -1;
    }
    .contact-wow-wrapper::after {
        content: '';
        position: absolute;
        bottom: -20%;
        right: -10%;
        width: 50%;
        height: 70%;
        background: radial-gradient(circle, rgba(162, 155, 254, 0.2) 0%, transparent 60%);
        filter: blur(60px);
        z-index: -1;
    }

    .contact-left {
        flex: 1;
        display: flex;
        flex-direction: column;
        justify-content: center;
    }

    .contact-left h2 {
        font-size: 3rem;
        font-weight: 800;
        line-height: 1.1;
        margin-bottom: 1.5rem;
        background: linear-gradient(135deg, #fff 0%, #a1a1aa 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
    }

    .contact-left p {
        font-size: 1.15rem;
        color: #a1a1aa;
        line-height: 1.6;
        margin-bottom: 2.5rem;
    }

    .tg-direct-btn {
        display: inline-flex;
        align-items: center;
        gap: 12px;
        padding: 14px 24px;
        border-radius: 100px;
        background: rgba(108, 92, 231, 0.1);
        border: 1px solid rgba(108, 92, 231, 0.3);
        color: #a29bfe;
        font-weight: 600;
        text-decoration: none;
        transition: all 0.3s ease;
        width: fit-content;
    }
    .tg-direct-btn:hover {
        background: rgba(108, 92, 231, 0.2);
        transform: translateY(-2px);
        box-shadow: 0 10px 20px rgba(108, 92, 231, 0.2);
    }

    .contact-right {
        flex: 1;
        background: rgba(0, 0, 0, 0.4);
        padding: 2.5rem;
        border-radius: 24px;
        border: 1px solid rgba(255, 255, 255, 0.05);
        box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }

    .wow-form-group {
        display: flex;
        flex-direction: column;
        gap: 0.5rem;
        margin-bottom: 1.5rem;
    }

    .wow-form-group label {
        font-size: 0.9rem;
        color: #e4e4e7;
        font-weight: 500;
        padding-left: 0.5rem;
    }

    .wow-input {
        padding: 1rem 1.2rem;
        border-radius: 12px;
        border: 1px solid rgba(255, 255, 255, 0.1);
        background: rgba(255, 255, 255, 0.03);
        color: #fff;
        font-size: 1rem;
        outline: none;
        transition: all 0.3s ease;
        font-family: inherit;
    }
    
    .wow-input:focus {
        border-color: #6c5ce7;
        background: rgba(255, 255, 255, 0.05);
        box-shadow: 0 0 0 4px rgba(108, 92, 231, 0.15);
    }

    .wow-submit {
        width: 100%;
        padding: 1.2rem;
        border-radius: 12px;
        border: none;
        background: linear-gradient(135deg, #6c5ce7 0%, #a29bfe 100%);
        color: #fff;
        font-size: 1.1rem;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.3s ease;
        box-shadow: 0 10px 20px rgba(108, 92, 231, 0.3);
    }

    .wow-submit:hover {
        transform: translateY(-2px);
        box-shadow: 0 15px 30px rgba(108, 92, 231, 0.4);
    }

    @media (max-width: 900px) {
        .contact-wow-wrapper {
            flex-direction: column;
            padding: 2.5rem;
            gap: 2.5rem;
        }
        .contact-left h2 { font-size: 2.5rem; }
    }
</style>
</head>
<body>

    <section style="padding: 100px 0;">
        <div class="contact-wow-wrapper">
            
            <div class="contact-left">
                <h2>Остались вопросы?</h2>
                <p>Не уверены, как интегрировать платформу в ваши процессы? Есть идеи или пожелания? Оставьте заявку, и мы обсудим это лично.</p>
                <a href="https://t.me/tikhonov_code" target="_blank" rel="noopener noreferrer" class="tg-direct-btn">
                    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 2L11 13"></path><path d="M22 2L15 22L11 13L2 9L22 2Z"></path></svg>
                    Написать разработчику
                </a>
            </div>

            <div class="contact-right">
                <form id="wowContactForm">
                    <div class="wow-form-group">
                        <label>Ваш Telegram (@username)</label>
                        <input type="text" class="wow-input" placeholder="@username" required>
                    </div>
                    <div class="wow-form-group">
                        <label>Опишите ваш вопрос или задачу</label>
                        <textarea class="wow-input" rows="4" placeholder="Интересует интеграция с..." style="resize: vertical;" required></textarea>
                    </div>
                    <button type="submit" class="wow-submit">Обсудить проект</button>
                    <div style="text-align: center; margin-top: 1rem; color: #a1a1aa; font-size: 0.85rem;">Мы свяжемся с вами в течение часа</div>
                </form>
            </div>

        </div>
    </section>

</body>
</html>
